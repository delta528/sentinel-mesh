name: SentinelMesh CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-validate:
    name: Code Quality & Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Secret Protection (.gitignore check)
        run: |
          if git ls-files --error-unmatch node_config.env 2>/dev/null; then
            echo "ERROR: node_config.env is tracked by Git! Aborting build."
            exit 1
          else
            echo "SUCCESS: node_config.env is safely ignored."
          fi

  integration-tests:
    name: Automated Ingestion & HMAC Tests
    needs: lint-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Create Mock Environment Config
        run: |
          cp node_config.env.example node_config.env

      - name: Run Express Server & Execute Integration Test Suite
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          node test_client.js
          kill $SERVER_PID

  docker-build-verify-publish:
    name: Docker Build, Health Check & Publish
    needs: integration-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (Local Verification)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: sentinel-mesh:local-test

      - name: Verify Container Deployment & Health Endpoint
        run: |
          docker run -d --name sentinel-node -p 3000:3000 -e TELEMETRY_SECRET="sentinel-mesh-secret-key-2026" sentinel-mesh:local-test
          sleep 3
          HEALTH_CHECK=$(curl -s http://localhost:3000/health)
          echo "Container Healthcheck Output: $HEALTH_CHECK"
          
          if [[ $HEALTH_CHECK == *"ONLINE"* ]]; then
            echo "Container Deployment Verified Successfully!"
          else
            echo "Health check failed!"
            docker logs sentinel-node
            exit 1
          fi

      - name: Push Container Image to GHCR
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}